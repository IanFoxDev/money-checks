name: examples

on:
  push:
    branches: [master]
  pull_request:

jobs:
  subscriptions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/subscriptions
    steps:
      - uses: actions/checkout@v7
      - run: docker compose build
      - name: Run the checks against the shop
        run: |
          mkdir -p out
          set +e
          MC_UID=$(id -u) MC_GID=$(id -g) docker compose run --rm money-checks \
            run -c /etc/money-checks/checks.yaml --json /out/report.json > out/report.md
          code=$?
          set -e
          cat out/report.md
          # Violations are planted, so money-checks must exit with 1. Compose
          # exits with 1 too when a database does not start, so check the report.
          test "$code" -eq 1
          grep -q '^| two_renewals_in_one_period | error | violations | 1 |' out/report.md
      - name: The checks find exactly the planted violations
        run: |
          MC_UID=$(id -u) MC_GID=$(id -g) docker compose run --rm money-checks \
            test -c /etc/money-checks/checks.yaml -t /etc/money-checks/tests.yaml
      - name: A check that no longer sees its data fails
        run: |
          # As if the code started writing another status: the query and its
          # expect match nothing. Without expect the check would pass.
          sed '/name: payment_without_subscription/,/name: unbalanced_transactions/ s/status: succeeded/status: success/' \
            checks.yaml > out/drift.yaml
          set +e
          MC_UID=$(id -u) MC_GID=$(id -g) docker compose run --rm money-checks \
            run -c /out/drift.yaml --check payment_without_subscription > out/drift.md
          code=$?
          set -e
          cat out/drift.md
          test "$code" -eq 2
          grep -q 'expect found 0, at least 1 required' out/drift.md
      - name: serve exposes the same numbers
        run: |
          docker compose up -d money-checks
          for i in $(seq 1 60); do curl -sf 127.0.0.1:8080/readyz && break; sleep 1; done
          curl -s 127.0.0.1:8080/metrics > metrics.txt
          grep -x 'money_check_violations{check="unbalanced_transactions",scope="full",severity="error"} 3' metrics.txt
          grep -x 'money_check_amount_minor_units{check="payments_reach_stats",currency="USD",scope="full"} 11399' metrics.txt
      - name: serve with a state file posts only what is new
        run: |
          docker compose stop money-checks
          { cat checks.yaml; printf 'serve:\n  state_file: /out/state.json\n'; } > out/serve.yaml
          serve() {
            # One start of serve: wait for its first run, stop it, keep the log.
            MC_UID=$(id -u) MC_GID=$(id -g) docker compose run -d --name mc-state money-checks \
              serve -c /out/serve.yaml > /dev/null
            for i in $(seq 1 60); do
              test "$(docker logs mc-state 2>&1 | grep -c '"msg":"check finished"')" -eq 9 && break
              sleep 1
            done
            docker logs mc-state > "out/$1.log" 2>&1
            docker rm -f mc-state > /dev/null
            grep '"msg":"state changed"' "out/$1.log" || true
          }
          # The first start posts every check that finds violations.
          serve first
          test "$(grep -c '"msg":"state changed"' out/first.log)" -eq 8
          # While serve is down, sub_d is charged twice for 2026-09. created_at is
          # now, inside settle, so payments_reach_stats does not see it yet.
          docker compose exec -T mongo mongosh -u root -p root --quiet --eval '
            db.getSiblingDB("shop").payments.insertOne({_id: "pay_20", subscription_id: "sub_d",
              user_id: "u_carl", kind: "renewal", status: "succeeded", amount: 19.99, currency: "EUR",
              period: "2026-09", provider: "globexpay", provider_txn: "G-2009", created_at: new Date()})'
          # The restart posts that one, although the check already had a violation.
          serve second
          test "$(grep -c '"msg":"state changed"' out/second.log)" -eq 1
          grep -q 'two_renewals_in_one_period found 1 new violation (19.99 EUR), 2 in all' out/second.log
          # A restart with nothing new posts nothing.
          serve third
          if grep -q '"msg":"state changed"' out/third.log; then exit 1; fi
          test "$(stat -c %a out/state.json)" = 600
      - if: failure()
        run: docker compose logs --no-color mongo postgres clickhouse | tail -n 200
      - if: always()
        run: docker compose down -v
