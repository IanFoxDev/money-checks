name: examples

on:
  push:
    branches: [master]
  pull_request:

jobs:
  subscriptions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/subscriptions
    steps:
      - uses: actions/checkout@v7
      - run: docker compose build
      - name: Run the checks against the shop
        run: |
          mkdir -p out
          set +e
          MC_UID=$(id -u) MC_GID=$(id -g) docker compose run --rm money-checks \
            run -c /etc/money-checks/checks.yaml --json /out/report.json > out/report.md
          code=$?
          set -e
          cat out/report.md
          # Violations are planted, so money-checks must exit with 1.
          test "$code" -eq 1
      - name: The checks find exactly the planted violations
        run: |
          MC_UID=$(id -u) MC_GID=$(id -g) docker compose run --rm money-checks \
            test -c /etc/money-checks/checks.yaml -t /etc/money-checks/tests.yaml
      - name: A check that no longer sees its data fails
        run: |
          # As if the code started writing another status: the query and its
          # expect match nothing. Without expect the check would pass.
          sed '/name: payment_without_subscription/,/name: unbalanced_transactions/ s/status: succeeded/status: success/' \
            checks.yaml > out/drift.yaml
          set +e
          MC_UID=$(id -u) MC_GID=$(id -g) docker compose run --rm money-checks \
            run -c /out/drift.yaml --check payment_without_subscription > out/drift.md
          code=$?
          set -e
          cat out/drift.md
          test "$code" -eq 2
          grep -q 'expect found 0, at least 1 required' out/drift.md
      - name: serve exposes the same numbers
        run: |
          docker compose up -d money-checks
          for i in $(seq 1 60); do curl -sf 127.0.0.1:8080/readyz && break; sleep 1; done
          curl -s 127.0.0.1:8080/metrics > metrics.txt
          grep -x 'money_check_violations{check="unbalanced_transactions",scope="full",severity="error"} 3' metrics.txt
          grep -x 'money_check_amount_minor_units{check="payments_reach_stats",currency="USD",scope="full"} 11399' metrics.txt
      - if: always()
        run: docker compose down -v
