name: go

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: checks
          POSTGRES_PASSWORD: checks
          POSTGRES_DB: checks
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U checks"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
      mongo:
        # 8.3 does not start on Linux 6.19 (SERVER-121912).
        image: mongo:8.2
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: root
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh -u root -p root --quiet --eval 'db.runCommand({ping: 1})'"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
      clickhouse:
        image: clickhouse/clickhouse-server:25.8
        env:
          CLICKHOUSE_USER: checks
          CLICKHOUSE_PASSWORD: checks
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports: ["8123:8123"]
        options: >-
          --health-cmd "wget -q -O /dev/null http://127.0.0.1:8123/ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # Database tests fail instead of skipping when a service is missing.
      MONEY_CHECKS_REQUIRE_DB: "1"
      MONEY_CHECKS_TEST_PG_DSN: postgres://checks:checks@127.0.0.1:5432/checks
      MONEY_CHECKS_TEST_MONGO_URI: mongodb://root:root@127.0.0.1:27017/?authSource=admin
      MONEY_CHECKS_TEST_CLICKHOUSE_URL: http://checks:checks@127.0.0.1:8123/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
