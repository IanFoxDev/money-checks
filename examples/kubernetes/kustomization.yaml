# kubectl apply -k examples/kubernetes
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: money-checks
labels:
  - pairs:
      app.kubernetes.io/name: money-checks
    includeSelectors: true
resources:
  - namespace.yaml
  - secret.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - servicemonitor.yaml
  - prometheusrule.yaml
# A new checks.yaml makes a new ConfigMap name, so the Deployment rolls.
configMapGenerator:
  - name: money-checks
    files:
      - checks.yaml
images:
  - name: ghcr.io/ianfoxdev/money-checks
    newTag: 0.6.1
