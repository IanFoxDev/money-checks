# Placeholders. Create the real Secret from your secret store (External Secrets,
# Sealed Secrets, Vault) and drop this file from kustomization.yaml: the values
# are database passwords and a Slack webhook.
apiVersion: v1
kind: Secret
metadata:
  name: money-checks
type: Opaque
stringData:
  # A user with the read role only, on a secondary.
  SHOP_MONGO_URI: mongodb://money_checks:change-me@mongo.shop.svc:27017/?readPreference=secondaryPreferred&serverSelectionTimeoutMS=5000
  # A role with SELECT on the tables the checks read, nothing else.
  LEDGER_PG_DSN: postgres://money_checks:change-me@postgres.ledger.svc:5432/ledger?sslmode=require
  SLACK_WEBHOOK_URL: https://hooks.slack.com/services/T0000/B0000/change-me
