# Databases with planted money bugs, one per kind, to test the recipes against.
#   docker compose build
#   docker compose run --rm money-checks test -c /recipes/postgres/checks.yaml -t /recipes/postgres/tests.yaml
#   docker compose run --rm money-checks test -c /recipes/mongodb/checks.yaml -t /recipes/mongodb/tests.yaml
#   docker compose run --rm money-checks test -c /recipes/clickhouse/checks.yaml -t /recipes/clickhouse/tests.yaml
name: money-checks-recipes

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - ./postgres/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql:ro
      - ./postgres/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql:ro
      - ./postgres/readonly.sql:/docker-entrypoint-initdb.d/3-readonly.sql:ro
    healthcheck:
      # Over TCP: during init the server listens on the socket only.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "app", "-d", "app"]
      interval: 2s
      retries: 30

  mongo:
    # 8.3 does not start on Linux 6.19 (SERVER-121912), which CI runners now have.
    image: mongo:8.2
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    volumes:
      - ./mongodb/init.js:/docker-entrypoint-initdb.d/init.js:ro
      - ./mongodb/seed:/seed:ro
    healthcheck:
      # Passes only once the seed has run and the read-only user exists.
      test: ["CMD", "mongosh", "-u", "checks", "-p", "checks", "--authenticationDatabase", "app", "--quiet", "--eval", "db.getSiblingDB('app').accounts.countDocuments()"]
      interval: 2s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: admin
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - ./clickhouse/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - ./clickhouse/analytics.sql:/analytics.sql:ro
    healthcheck:
      # Passes only once the data is loaded and the read-only user exists.
      test: ["CMD", "clickhouse-client", "-u", "checks", "--password", "checks", "-q", "select count() from analytics.payments"]
      interval: 2s
      retries: 30

  money-checks:
    build: ..
    environment:
      APP_PG_DSN: postgres://checks:checks@postgres:5432/app
      APP_MONGO_URI: mongodb://checks:checks@mongo:27017/?authSource=app
      ANALYTICS_CLICKHOUSE_URL: http://checks:checks@clickhouse:8123/
    volumes:
      - ./postgres:/recipes/postgres:ro
      - ./mongodb:/recipes/mongodb:ro
      - ./clickhouse:/recipes/clickhouse:ro
    depends_on:
      postgres: {condition: service_healthy}
      mongo: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
