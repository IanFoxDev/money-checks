# Money invariants for MongoDB. Each pipeline lives in its own file: copy the
# file and the check, change the collection and field names to yours.
# Amounts are Decimal128 in major units; doubles and integers in minor units
# work too, see docs/config.md. CI runs money-checks test with tests.yaml
# against the documents in seed/.
version: 1
defaults:
  timeout: 30s
sources:
  app:
    mongodb:
      uri_env: APP_MONGO_URI
      database: app
  analytics:
    clickhouse:
      url_env: ANALYTICS_CLICKHOUSE_URL
      database: analytics

checks:
  - name: negative_balance
    description: An account that may not go below zero is below zero.
    source: app
    collection: accounts
    pipeline_file: negative_balance.yaml
    amount: {field: balance, unit: major, currency_field: currency}
    show: [owner]
    expect: {pipeline: [{$count: n}]}

  - name: unbalanced_transaction
    description: A ledger transaction's entries do not sum to zero in a currency.
    source: app
    collection: entries
    window: 24h
    pipeline_file: unbalanced_transaction.yaml
    amount: {field: imbalance, unit: major, currency_field: currency}
    show: [entries]
    expect: {pipeline: [{$count: n}]}

  - name: balance_matches_entries
    description: An account's stored balance is not the sum of its entries.
    source: app
    collection: accounts
    every: 6h
    pipeline_file: balance_matches_entries.yaml
    amount: {field: difference, unit: major, currency_field: currency}
    show: [owner, balance, entries_sum]
    expect: {pipeline: [{$count: n}]}

  - name: duplicate_provider_txn
    description: One provider transaction is recorded as more than one payment.
    source: app
    collection: payments
    window: 24h
    pipeline_file: duplicate_provider_txn.yaml
    amount: {field: extra, unit: major, currency_field: currency}
    show: [payments, payment_ids]
    expect: {pipeline: [{$match: {status: succeeded}}, {$count: n}]}

  - name: refund_exceeds_payment
    description: A payment is refunded for more than was paid.
    source: app
    collection: payments
    window: 24h
    pipeline_file: refund_exceeds_payment.yaml
    amount: {field: over, unit: major, currency_field: currency}
    show: [amount, refunded, refund_count]
    expect: {pipeline: [{$match: {refunds.0: {$exists: true}}}, {$count: n}]}

  - name: currency_mismatch
    description: A successful payment is in another currency than its order.
    source: app
    collection: payments
    window: 24h
    pipeline_file: currency_mismatch.yaml
    amount: {field: amount, unit: major, currency_field: currency}
    show: [order_id, order_amount, order_currency]
    expect: {pipeline: [{$match: {status: succeeded}}, {$count: n}]}

  - name: stuck_in_pending
    description: A payment is still pending an hour after it started.
    source: app
    collection: payments
    pipeline_file: stuck_in_pending.yaml
    amount: {field: amount, unit: major, currency_field: currency}
    show: [provider, provider_txn_id, created_at]
    expect: {pipeline: [{$count: n}]}

  - name: paid_not_granted
    description: An order was paid more than 30 minutes ago and is not fulfilled.
    source: app
    collection: orders
    pipeline_file: paid_not_granted.yaml
    amount: {field: amount, unit: major, currency_field: currency}
    show: [payment_id, paid_at]
    expect: {pipeline: [{$count: n}]}

  - name: access_after_expiry
    description: A subscription is active days after its paid period ended.
    source: app
    collection: subscriptions
    pipeline_file: access_after_expiry.yaml
    amount: {field: price, unit: major, currency_field: currency}
    show: [owner, current_period_end]
    expect: {pipeline: [{$count: n}]}

  - name: daily_totals_match
    description: Successful payments per day and currency match the analytics in ClickHouse.
    # A payment of the last 15 minutes may still be on its way to ClickHouse:
    # both sides read only the rows before that.
    window: 720h
    settle: 15m
    compare:
      left:
        source: app
        collection: payments
        pipeline_file: daily_totals_match.yaml
        expect: {pipeline: [{$match: {status: succeeded}}, {$count: n}]}
      right:
        source: analytics
        query_file: ../clickhouse/daily_totals.sql
        expect: {query: select count() from payments}
      key: [day, currency]
      amount: {field: amount, unit: major, currency_field: currency}
      counts: [payments]
